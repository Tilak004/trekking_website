{{define "title"}}Gallery · {{.Brand}}{{end}}
{{define "content"}}
<header class="page-head">
  <p class="eyebrow">Real photos, real trails</p>
  <h1>Gallery</h1>
  <p class="muted">Moments from our treks across the Western Ghats and beyond. Tap a photo to view it full size.</p>
</header>
<div class="gallery">
  {{range .Gallery}}<a href="/photos/{{.}}"><img src="/photos/{{.}}" alt="Trek photo" loading="lazy"></a>{{else}}<p class="muted">Photos coming soon.</p>{{end}}
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" aria-label="Close">×</button>
  <button class="lb-prev" aria-label="Previous photo">‹</button>
  <img alt="Trek photo">
  <button class="lb-next" aria-label="Next photo">›</button>
</div>
<script>
(() => {
  const links = [...document.querySelectorAll('.gallery a')];
  const lb = document.getElementById('lightbox');
  const img = lb.querySelector('img');
  let i = 0;
  const show = n => { i = (n + links.length) % links.length; img.src = links[i].href; lb.hidden = false; };
  const close = () => { lb.hidden = true; };
  links.forEach((a, n) => a.addEventListener('click', e => { e.preventDefault(); show(n); }));
  lb.querySelector('.lb-close').onclick = close;
  lb.querySelector('.lb-prev').onclick = () => show(i - 1);
  lb.querySelector('.lb-next').onclick = () => show(i + 1);
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  document.addEventListener('keydown', e => {
    if (lb.hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(i - 1);
    if (e.key === 'ArrowRight') show(i + 1);
  });
})();
</script>
{{end}}
