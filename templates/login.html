{{define "title"}}Log in · {{.Brand}}{{end}}
{{define "content"}}
<div class="auth panel">
  <h1>Log in</h1>
  <form method="post" action="/login" class="form">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Email <input type="email" name="email" value="{{.Email}}" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <label class="check small"><input type="checkbox" onchange="this.form.password.type = this.checked ? 'text' : 'password'"> Show password</label>
    <button class="btn block">Log in</button>
  </form>
  <p class="muted small">No account yet? <a href="/signup">Sign up</a></p>
</div>
{{end}}
