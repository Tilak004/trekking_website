{{define "title"}}Admin login{{end}}
{{define "content"}}
<section class="c-login-card">
  <img src="/photos/logo/badge.png" alt="" onerror="this.onerror=null;this.src='/static/logo/mark-small.png'">
  <h1>{{.Brand}}</h1>
  <p class="muted">Admin console. Sign in with an admin account.</p>
  {{with .Err}}<div class="flash err">{{.}}</div>{{end}}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Email <input type="email" name="email" value="{{.Email}}" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn big">Sign in</button>
  </form>
</section>
{{end}}
