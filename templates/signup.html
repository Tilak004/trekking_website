{{define "title"}}Sign up · {{.Brand}}{{end}}
{{define "content"}}
<div class="auth panel">
  <h1>Create your account</h1>
  <form method="post" action="/signup" class="form">
    <label>Full name <input name="name" value="{{.Form.Name}}" required maxlength="100" autofocus autocomplete="name"></label>
    <label>Email <input type="email" name="email" value="{{.Form.Email}}" required maxlength="200" autocomplete="email" autocapitalize="none" spellcheck="false"></label>
    <label>Phone (WhatsApp) <input type="tel" name="phone" value="{{.Form.Phone}}" required maxlength="30" inputmode="tel" autocomplete="tel"></label>
    <label>Password <input type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password"></label>
    <label class="check small"><input type="checkbox" onchange="this.form.password.type = this.checked ? 'text' : 'password'"> Show password</label>
    <button class="btn block">Sign up</button>
  </form>
  <p class="muted small">Already have an account? <a href="/login">Log in</a></p>
</div>
{{end}}
